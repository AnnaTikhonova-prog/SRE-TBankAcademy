service:
  type: ClusterIP

image:
  repository: grafana/grafana
  tag: 12.2.5
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 1Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
        editable: false
        jsonData:
          prometheusType: Prometheus
          timeInterval: 15s

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring
    folder: /var/lib/grafana/dashboards/default
    provider:
      foldersFromFilesStructure: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ShiftPlanner
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
