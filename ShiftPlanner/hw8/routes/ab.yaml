apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shiftplanner-route
  namespace: shiftplanner
spec:
  parentRefs:
    - name: shiftplanner-gateway
  rules:
    - matches:
        - headers:
            - name: X-Experiment
              value: beta
      backendRefs:
        - name: backend-v2
          port: 8000
    - backendRefs:
        - name: backend-v1
          port: 8000
