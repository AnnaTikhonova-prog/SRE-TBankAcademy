apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: shiftplanner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-v1
  template:
    metadata:
      labels:
        app: backend-v1
        release: v1
    spec:
      containers:
        - name: backend
          image: shiftplanner-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: shiftplanner-config
            - secretRef:
                name: shiftplanner-secret
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_RELEASE
              value: "v1"
          readinessProbe:
            httpGet:
              path: /health/db
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: shiftplanner
spec:
  selector:
    app: backend-v1
  ports:
    - name: http
      port: 8000
      targetPort: http
---
