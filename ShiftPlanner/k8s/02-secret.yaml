# Секреты приложения. Для учебного стенда значения заданы прямо в манифесте;
# в реальной эксплуатации Secret не коммитят, а создают отдельно
# (kubectl create secret / внешний менеджер секретов).
apiVersion: v1
kind: Secret
metadata:
  name: shiftplanner-secret
  namespace: shiftplanner
type: Opaque
stringData:
  # Учебные placeholders: замените своими значениями перед развёртыванием.
  POSTGRES_PASSWORD: "replace-me-before-deploy"
  JWT_SECRET_KEY: "replace-me-with-a-random-string-of-at-least-32-chars"
