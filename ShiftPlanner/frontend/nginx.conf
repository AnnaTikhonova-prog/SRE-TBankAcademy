# Nginx внутри контейнера фронтенда:
# - отдаёт статику собранного React-приложения;
# - проксирует запросы /api/* на бэкенд (браузер ходит на один origin,
#   поэтому CORS в production-контуре не нужен).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: все неизвестные пути отдаём на index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/... -> http://backend:8000/... (префикс /api срезается).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
